name: SHOP validation and container publication
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ''
          - runner: ubuntu-24.04-arm
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: go -C backend test -race -timeout=20m ./...
      - run: python3 -m unittest infra.tests.test_shop_oci_rollback -v
      - run: npm run web:build
      - name: Build SHOP image
        run: docker build --build-arg SUITE_RELEASE_SHA="${GITHUB_SHA}" -f infra/linux/Dockerfile.station -t shop-ci:${GITHUB_SHA} .
      - name: Smoke-test isolated SHOP image
        run: |
          set -euo pipefail
          docker run -d --name shop-ci -p 127.0.0.1:18095:8095 shop-ci:${GITHUB_SHA}
          trap 'docker logs shop-ci; docker rm -f shop-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["data"]["revision"] == os.environ["GITHUB_SHA"]'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/mes/login)" = 404
      - name: Verify isolated Shop candidate lifecycle with synthetic data
        env:
          SHOP_CANDIDATE_TEST_IMAGE: shop-ci:${{ github.sha }}
        run: python3 infra/oci/shop-candidate/smoke_test.py
      - name: Install Chromium for print preview lifecycle acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify print preview request cancellation in the SHOP image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name shop-browser -p 127.0.0.1:18095:8095 shop-ci:${GITHUB_SHA}
          trap 'docker logs shop-browser; docker rm -f shop-browser' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["data"]["revision"] == os.environ["GITHUB_SHA"]'
          npx playwright test --config playwright.lifecycle.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-print-preview-browser-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish-shop-images:
    name: Publish validated SHOP image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ''
          - runner: ubuntu-24.04-arm
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run install:ci
      - run: npm run web:build
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the architecture image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-shop-station"
          docker build --build-arg SUITE_RELEASE_SHA="${GITHUB_SHA}" -f infra/linux/Dockerfile.station -t "shop-ci:${GITHUB_SHA}" .
          test "$(docker image inspect "shop-ci:${GITHUB_SHA}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
      - name: Smoke-test the exact image before publication
        env:
          SHOP_CANDIDATE_TEST_IMAGE: shop-ci:${{ github.sha }}
        run: python3 infra/oci/shop-candidate/smoke_test.py
      - name: Publish the tested architecture image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-shop-station"
          docker tag "shop-ci:${GITHUB_SHA}" "$image:${GITHUB_SHA}${{ matrix.suffix }}"
          docker push "$image:${GITHUB_SHA}${{ matrix.suffix }}"
  publish-candidate-index:
    name: Publish immutable Shop candidate image index
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-shop-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish multi-architecture private candidate tag
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-shop-station"
          docker manifest create "$image:${GITHUB_SHA}-private-candidate" \
            "$image:${GITHUB_SHA}" "$image:${GITHUB_SHA}-arm64"
          docker manifest push --purge "$image:${GITHUB_SHA}-private-candidate"
          docker manifest inspect "$image:${GITHUB_SHA}-private-candidate" > candidate-index.json
          python3 -c 'import json,sys; value=json.load(open("candidate-index.json")); assert {item["platform"]["architecture"] for item in value["manifests"]} >= {"amd64", "arm64"}'
          docker buildx imagetools inspect "$image:${GITHUB_SHA}-private-candidate" --format '{{json .Manifest.Digest}}' | python3 -c 'import re,sys; value=sys.stdin.read().strip().strip("\""); assert re.fullmatch(r"sha256:[0-9a-f]{64}", value), value; print(value)'
  postgres-pilot:
    name: Verify Shop transactions on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: shop_test
          POSTGRES_DB: shop_pilot
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U shop_test -d shop_pilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run PostgreSQL transaction tests
        env:
          SHOP_POSTGRES_TEST_URL: postgres://shop_test:shop_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/shop_pilot?sslmode=disable
        run: go -C backend test -race -run '^TestShop(Postgres|SQLiteImport|Portfolio)' -count=1 -v
