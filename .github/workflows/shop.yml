name: SHOP validation and container publication
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  shop:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ''
          - runner: ubuntu-24.04-arm
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: go -C backend test -race -timeout=20m ./...
      - run: npm run web:build
      - name: Build SHOP image
        run: docker build --build-arg SUITE_RELEASE_SHA="${GITHUB_SHA}" -f infra/linux/Dockerfile.station -t shop-ci:${GITHUB_SHA} .
      - name: Smoke-test isolated SHOP image
        run: |
          set -euo pipefail
          docker run -d --name shop-ci -p 127.0.0.1:18095:8095 shop-ci:${GITHUB_SHA}
          trap 'docker logs shop-ci; docker rm -f shop-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["data"]["revision"] == os.environ["GITHUB_SHA"]'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/mes/login)" = 404
      - name: Install Chromium for print preview lifecycle acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify print preview request cancellation in the SHOP image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name shop-browser -p 127.0.0.1:18095:8095 shop-ci:${GITHUB_SHA}
          trap 'docker logs shop-browser; docker rm -f shop-browser' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["data"]["revision"] == os.environ["GITHUB_SHA"]'
          npx playwright test --config playwright.lifecycle.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-print-preview-browser-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish SHOP image on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-shop-station"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag shop-ci:${GITHUB_SHA} "$image:${GITHUB_SHA}${{ matrix.suffix }}"
          docker push "$image:${GITHUB_SHA}${{ matrix.suffix }}"
  postgres-pilot:
    name: Verify Shop transactions on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: shop_test
          POSTGRES_DB: shop_pilot
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U shop_test -d shop_pilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run PostgreSQL transaction tests
        env:
          SHOP_POSTGRES_TEST_URL: postgres://shop_test:shop_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/shop_pilot?sslmode=disable
        run: go -C backend test -race -run '^TestShop(Postgres|SQLiteImport)' -count=1 -v
